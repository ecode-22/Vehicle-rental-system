services:
  backend:
    build: ./backend
    command: sh -c 'test -n "$$DATABASE_URL" || (echo "DATABASE_URL is missing; set it in backend/.env" >&2; exit 1); python manage.py migrate && python manage.py runserver 0.0.0.0:8000'
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,${HOST_IP:-localhost}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_CORS_ALLOWED_ORIGINS: http://${HOST_IP:-localhost}:5173,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backend_media:/app/media

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://${HOST_IP:-localhost}:8000/api
    depends_on:
      - backend

volumes:
  backend_media: